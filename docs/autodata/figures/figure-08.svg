<svg viewBox="0 0 1000 430" role="img" aria-label="子任务边界抖动示意" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="ah1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#e8590c"></path>
      </marker>
      <marker id="ah1b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#1971c2"></path>
      </marker>
    </defs>

    <text x="16" y="34" font-size="14" font-weight="700" fill="#212529">源演示的边界（录制结果）</text>
    <g font-size="12" fill="#495057">
      <rect x="120" y="48" width="240" height="34" fill="#d0ebff" stroke="#4dabf7"></rect>
      <rect x="360" y="48" width="200" height="34" fill="#b2f2bb" stroke="#69db7c"></rect>
      <rect x="560" y="48" width="200" height="34" fill="#ffec99" stroke="#ffd43b"></rect>
      <rect x="760" y="48" width="160" height="34" fill="#ffc9c9" stroke="#ff8787"></rect>
      <text x="240" y="70" text-anchor="middle">子任务 0</text>
      <text x="460" y="70" text-anchor="middle">子任务 1</text>
      <text x="660" y="70" text-anchor="middle">子任务 2</text>
      <text x="840" y="70" text-anchor="middle">子任务 3 (末段)</text>
    </g>
    <g stroke="#212529" stroke-width="1.5">
      <line x1="120" y1="44" x2="120" y2="86"></line><line x1="360" y1="44" x2="360" y2="86"></line>
      <line x1="560" y1="44" x2="560" y2="86"></line><line x1="760" y1="44" x2="760" y2="86"></line>
      <line x1="920" y1="44" x2="920" y2="86"></line>
    </g>
    <text x="120" y="104" font-size="11" fill="#868e96" text-anchor="middle">start₀</text>
    <text x="360" y="104" font-size="11" fill="#868e96" text-anchor="middle">end₀</text>
    <text x="560" y="104" font-size="11" fill="#868e96" text-anchor="middle">end₁</text>
    <text x="760" y="104" font-size="11" fill="#868e96" text-anchor="middle">end₂</text>
    <text x="920" y="104" font-size="11" fill="#868e96" text-anchor="middle">末尾(固定)</text>

    <text x="16" y="150" font-size="14" font-weight="700" fill="#e8590c">MimicGen / DexMimicGen　┃ 只有“终点”抖动</text>
    <text x="16" y="171" font-size="12" fill="#868e96">起点被锁死为上一段的终点 —— 段与段首尾相接</text>

    <text x="16" y="212" font-size="11.5" fill="#adb5bd">采样 A</text>
    <rect x="144" y="196" width="336" height="24" fill="#d0ebff" stroke="#4dabf7"></rect>
    <rect x="480" y="196" width="176" height="24" fill="#b2f2bb" stroke="#69db7c"></rect>
    <rect x="656" y="196" width="248" height="24" fill="#ffec99" stroke="#ffd43b"></rect>
    <rect x="904" y="196" width="16" height="24" fill="#ffc9c9" stroke="#ff8787"></rect>
    <text x="16" y="256" font-size="11.5" fill="#adb5bd">采样 B</text>
    <rect x="128" y="240" width="320" height="24" fill="#d0ebff" stroke="#4dabf7"></rect>
    <rect x="448" y="240" width="264" height="24" fill="#b2f2bb" stroke="#69db7c"></rect>
    <rect x="712" y="240" width="152" height="24" fill="#ffec99" stroke="#ffd43b"></rect>
    <rect x="864" y="240" width="56" height="24" fill="#ffc9c9" stroke="#ff8787"></rect>
    <text x="16" y="300" font-size="11.5" fill="#adb5bd">采样 C</text>
    <rect x="152" y="284" width="280" height="24" fill="#d0ebff" stroke="#4dabf7"></rect>
    <rect x="432" y="284" width="296" height="24" fill="#b2f2bb" stroke="#69db7c"></rect>
    <rect x="728" y="284" width="120" height="24" fill="#ffec99" stroke="#ffd43b"></rect>
    <rect x="848" y="284" width="72" height="24" fill="#ffc9c9" stroke="#ff8787"></rect>

    <path d="M360,110 C420,150 470,160 480,196" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#ah1)"></path>
    <path d="M560,110 C620,150 640,160 656,196" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#ah1)"></path>
    <path d="M760,110 C840,150 880,160 904,196" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#ah1)"></path>
    <text x="612" y="150" font-size="11.5" fill="#e8590c">subtask_term_offset_range = [10, 20]　（末段强制 [0,0]）</text>

    <line x1="0" y1="336" x2="1000" y2="336" stroke="#e9ecef"></line>
    <text x="16" y="366" font-size="14" font-weight="700" fill="#2f9e44">SkillGen　┃ 起点和终点都抖动</text>
    <text x="16" y="387" font-size="12" fill="#868e96">因为 SkillGen 读“起点信号”，进入 skill 段的位置可随机；段间留出的空隙由 MP transit 补上</text>
    <text x="16" y="421" font-size="11.5" fill="#adb5bd">采样</text>
    <rect x="144" y="404" width="328" height="24" fill="#d0ebff" stroke="#4dabf7"></rect>
    <rect x="520" y="404" width="144" height="24" fill="#b2f2bb" stroke="#69db7c"></rect>
    <rect x="680" y="404" width="160" height="24" fill="#ffec99" stroke="#ffd43b"></rect>
    <rect x="856" y="404" width="64" height="24" fill="#ffc9c9" stroke="#ff8787"></rect>
    <g stroke="#2f9e44" stroke-width="1.4" stroke-dasharray="4 3">
      <line x1="120" y1="396" x2="144" y2="396"></line><line x1="360" y1="396" x2="472" y2="396"></line>
      <line x1="560" y1="396" x2="520" y2="396"></line>
    </g>
    <text x="676" y="421" font-size="11" fill="#2f9e44">subtask_start_offset_range 也在动</text>
  </svg>
