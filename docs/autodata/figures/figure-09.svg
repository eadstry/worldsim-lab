<svg viewBox="0 0 1000 340" role="img" aria-label="源段选择示意" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#e8590c"></path>
      </marker>
      <marker id="ahb2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#1971c2"></path>
      </marker>
    </defs>

    <!-- ===== 左：当前场景（距离基准） ===== -->
    <text x="16" y="28" font-size="13" font-weight="700" fill="#212529">当前场景</text>
    <rect x="16" y="42" width="184" height="198" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="108" y="66" font-size="11" fill="#4c6ef5" text-anchor="middle">同一子任务的起点</text>

    <circle cx="70" cy="128" r="17" fill="#4dabf7"></circle>
    <text x="70" y="133" font-size="12" fill="#fff" text-anchor="middle">物</text>
    <text x="70" y="166" font-size="11" fill="#1971c2" text-anchor="middle">物体位姿</text>

    <line x1="146" y1="104" x2="86" y2="122" stroke="#a5d8ff" stroke-width="1.4" stroke-dasharray="4 3"></line>
    <circle cx="152" cy="100" r="6" fill="#1971c2"></circle>
    <text x="152" y="86" font-size="11" fill="#1971c2" text-anchor="middle">EEF 位姿</text>

    <text x="108" y="212" font-size="11" fill="#5c7cfa" text-anchor="middle">d 由「物体位姿」或</text>
    <text x="108" y="228" font-size="11" fill="#5c7cfa" text-anchor="middle">「EEF 位姿」算出</text>

    <path d="M208,108 H232" stroke="#adb5bd" stroke-width="2" marker-end="url(#ahb2)"></path>

    <!-- ===== 中：候选列表 ===== -->
    <text x="232" y="28" font-size="13" font-weight="700" fill="#212529">源演示候选（按 d 升序）</text>
    <g font-size="11" fill="#868e96">
      <rect x="592" y="17" width="12" height="12" rx="3" fill="#ebfbee" stroke="#69db7c"></rect>
      <text x="609" y="27">入选</text>
      <rect x="650" y="17" width="12" height="12" rx="3" fill="#f8f9fa" stroke="#dee2e6"></rect>
      <text x="667" y="27">落选</text>
    </g>

    <!-- top-k 候选池 -->
    <rect x="232" y="42" width="494" height="132" rx="10" fill="#ebfbee" stroke="#69db7c" stroke-dasharray="6 4"></rect>

    <rect x="240" y="50" width="478" height="34" rx="7" fill="#fff" stroke="#69db7c"></rect>
    <text x="254" y="71" font-size="12" fill="#2b8a3e">demo #2</text>
    <rect x="320" y="60" width="39" height="14" rx="7" fill="#69db7c"></rect>
    <text x="710" y="71" font-size="12" fill="#868e96" text-anchor="end">d = 0.04</text>

    <rect x="240" y="90" width="478" height="34" rx="7" fill="#fff" stroke="#2f9e44" stroke-width="2"></rect>
    <text x="254" y="111" font-size="12" font-weight="700" fill="#2b8a3e">demo #5</text>
    <rect x="320" y="100" width="68" height="14" rx="7" fill="#69db7c"></rect>
    <text x="710" y="111" font-size="12" fill="#2b8a3e" text-anchor="end">d = 0.07</text>

    <rect x="240" y="130" width="478" height="34" rx="7" fill="#fff" stroke="#69db7c"></rect>
    <text x="254" y="151" font-size="12" fill="#2b8a3e">demo #0</text>
    <rect x="320" y="140" width="106" height="14" rx="7" fill="#69db7c"></rect>
    <text x="710" y="151" font-size="12" fill="#868e96" text-anchor="end">d = 0.11</text>

    <text x="232" y="190" font-size="11" fill="#2f9e44">↑ 前 k = 3 名入选（其余不参与随机）</text>

    <rect x="240" y="200" width="478" height="34" rx="7" fill="#f8f9fa" stroke="#dee2e6"></rect>
    <text x="254" y="221" font-size="12" fill="#868e96">demo #3</text>
    <rect x="320" y="210" width="184" height="14" rx="7" fill="#ced4da"></rect>
    <text x="710" y="221" font-size="12" fill="#adb5bd" text-anchor="end">d = 0.19</text>

    <rect x="240" y="240" width="478" height="34" rx="7" fill="#f8f9fa" stroke="#dee2e6"></rect>
    <text x="254" y="261" font-size="12" fill="#868e96">demo #1</text>
    <rect x="320" y="250" width="252" height="14" rx="7" fill="#ced4da"></rect>
    <text x="710" y="261" font-size="12" fill="#adb5bd" text-anchor="end">d = 0.26</text>

    <rect x="240" y="280" width="478" height="34" rx="7" fill="#f8f9fa" stroke="#dee2e6"></rect>
    <text x="254" y="301" font-size="12" fill="#868e96">demo #4</text>
    <rect x="320" y="290" width="300" height="14" rx="7" fill="#ced4da"></rect>
    <text x="710" y="301" font-size="12" fill="#adb5bd" text-anchor="end">d = 0.31</text>

    <!-- ===== 右：随机选取 ===== -->
    <path d="M732,108 H766" stroke="#e8590c" stroke-width="2" marker-end="url(#ah2)"></path>
    <rect x="770" y="38" width="214" height="140" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"></rect>
    <text x="877" y="74" font-size="22" text-anchor="middle">🎲</text>
    <text x="877" y="99" font-size="12.5" font-weight="700" fill="#e8590c" text-anchor="middle">在 top-k 中等概率随机</text>
    <rect x="796" y="111" width="162" height="30" rx="15" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="877" y="131" font-size="12" fill="#2b8a3e" text-anchor="middle">demo #5 被选中</text>
    <text x="877" y="163" font-size="11" fill="#868e96" text-anchor="middle">每次重选可能换成 #2 / #0</text>

    <text x="232" y="332" font-size="11" fill="#868e96">条形长度 ∝ d；d = 平移距离 + 旋转角距离（按物体位姿或变换后 EEF 位姿计算）</text>
  </svg>
