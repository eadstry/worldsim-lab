<svg viewBox="0 0 1000 300" role="img" aria-label="物体相对技能段的刚体变换示意" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#e8590c"></path>
      </marker>
      <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#1971c2"></path>
      </marker>
    </defs>

    <!-- 左：源场景 -->
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#1971c2">源场景（录制时）</text>
    <rect x="16" y="40" width="300" height="220" rx="12" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <circle cx="90" cy="220" r="17" fill="#1971c2"></circle>
    <text x="90" y="225" font-size="11" fill="#fff" text-anchor="middle">物</text>
    <text x="90" y="258" font-size="11" fill="#1971c2" text-anchor="middle">T_source_object</text>
    <polyline points="120,120 170,95 230,105 270,160" fill="none" stroke="#e8590c" stroke-width="2.5"></polyline>
    <g fill="#e8590c"><circle cx="120" cy="120" r="4.5"></circle><circle cx="170" cy="95" r="4.5"></circle><circle cx="230" cy="105" r="4.5"></circle><circle cx="270" cy="160" r="4.5"></circle></g>
    <text x="170" y="86" font-size="11" fill="#e8590c" text-anchor="middle">源 EEF 轨迹（物体系下）</text>
    <line x1="90" y1="220" x2="270" y2="160" stroke="#adb5bd" stroke-dasharray="4 3"></line>
    <text x="150" y="205" font-size="10.5" fill="#868e96">实测相对位姿</text>

    <!-- 中间：变换 -->
    <path d="M326,150 h48" stroke="#adb5bd" stroke-width="2" marker-end="url(#ab)"></path>
    <rect x="384" y="96" width="232" height="110" rx="12" fill="#f8f0fc" stroke="#d0bfff"></rect>
    <text x="500" y="124" font-size="13.5" fill="#9c36b5" text-anchor="middle" font-weight="700">刚体变换（纯位姿运算）</text>
    <text x="500" y="150" font-size="11.5" fill="#495057" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">inv(源物体) → 当前物体</text>
    <text x="500" y="172" font-size="11" fill="#868e96" text-anchor="middle">动作空间做不到，位姿空间可以</text>
    <text x="500" y="192" font-size="11" fill="#868e96" text-anchor="middle">（选段 / 变换 / 插值 / 拼接 / 规划 / hold 都只认位姿）</text>

    <!-- 右：新场景 -->
    <path d="M620,150 h48" stroke="#adb5bd" stroke-width="2" marker-end="url(#ab)"></path>
    <text x="684" y="26" font-size="13.5" font-weight="700" fill="#2f9e44">新场景（本次 attempt）</text>
    <rect x="684" y="40" width="300" height="220" rx="12" fill="#ebfbee" stroke="#69db7c"></rect>
    <circle cx="800" cy="200" r="17" fill="#2f9e44"></circle>
    <text x="800" y="205" font-size="11" fill="#fff" text-anchor="middle">物</text>
    <text x="800" y="238" font-size="11" fill="#2f9e44" text-anchor="middle">T_current_object（已随机）</text>
    <polyline points="712,120 762,95 822,105 862,160" fill="none" stroke="#e8590c" stroke-width="2.5"></polyline>
    <g fill="#e8590c"><circle cx="712" cy="120" r="4.5"></circle><circle cx="762" cy="95" r="4.5"></circle><circle cx="822" cy="105" r="4.5"></circle><circle cx="862" cy="160" r="4.5"></circle></g>
    <text x="800" y="86" font-size="11" fill="#e8590c" text-anchor="middle">变换后的 EEF 轨迹</text>

    <text x="120" y="290" font-size="11.5" fill="#868e96">同一个技能段 · 物体相对</text>
    <text x="800" y="290" font-size="11.5" fill="#868e96" text-anchor="middle">物体位置换了，轨迹跟着换</text>
  </svg>
