      <circle cx="830" cy="150" r="5"></circle>
    </g>
    <g stroke="#9c36b5" stroke-width="1" opacity="0.5">
      <line x1="170" y1="115" x2="170" y2="135"></line><line x1="330" y1="99" x2="330" y2="109"></line>
      <line x1="460" y1="146" x2="460" y2="160"></line><line x1="600" y1="191" x2="600" y2="205"></line>
      <line x1="730" y1="185" x2="730" y2="170"></line>
    </g>

    <rect x="620" y="34" width="356" height="70" rx="10" fill="#f8f0fc" stroke="#d0bfff"></rect>
    <text x="640" y="64" font-size="14" fill="#9c36b5" font-family="ui-monospace,Menlo,monospace">pose_action += σ · randn_like(...)</text>
    <text x="640" y="88" font-size="12" fill="#868e96">σ = 该子任务的 action_noise；夹到 [-1,1]</text>
