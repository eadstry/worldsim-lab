      <circle cx="40" cy="150" r="5"></circle><circle cx="180" cy="115" r="5"></circle><circle cx="320" cy="99" r="5"></circle>
      <circle cx="460" cy="146" r="5"></circle><circle cx="600" cy="191" r="5"></circle><circle cx="740" cy="185" r="5"></circle>
      <circle cx="830" cy="150" r="5"></circle>
    </g>

    <text x="20" y="212" font-size="13" font-weight="700" fill="#9c36b5">加噪后（每次采样不同）</text>
    <path d="M40,150 C150,120 220,80 340,118 S600,235 830,150" stroke="#9c36b5" stroke-width="2.5" fill="none"></path>
    <g fill="#9c36b5">
