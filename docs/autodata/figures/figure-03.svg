    <!-- 切分结果 -->
    <line x1="20" y1="188" x2="980" y2="188" stroke="#e9ecef"></line>
    <text x="16" y="214" font-size="12.5" font-weight="700" fill="#212529">解析出的子任务边界（MimicGen：首尾相接）</text>
