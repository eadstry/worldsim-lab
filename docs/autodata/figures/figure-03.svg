<svg viewBox="0 0 1000 300" role="img" aria-label="标注信号与子任务边界" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
