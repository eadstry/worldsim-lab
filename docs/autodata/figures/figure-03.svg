    <text x="800" y="248" text-anchor="middle" font-size="12">放置 [8,12)（末段）</text>
    <g stroke="#212529" stroke-width="1.5">
      <line x1="60" y1="222" x2="60" y2="264"></line><line x1="356" y1="222" x2="356" y2="264"></line>
      <line x1="652" y1="222" x2="652" y2="264"></line><line x1="948" y1="222" x2="948" y2="264"></line>
    </g>
    <text x="500" y="292" font-size="11.5" fill="#868e96" text-anchor="middle">三段只需两个内部切点，所以完成信号只有 grasp、lift 两个键；末段直接延续到整条演示末尾</text>
  </svg>
