<svg viewBox="0 0 1000 250" role="img" aria-label="异步多环境锁步" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="a8b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#495057"></path>
      </marker>
    </defs>
    <rect x="16" y="30" width="150" height="34" rx="8" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="91" y="52" font-size="12" text-anchor="middle" fill="#1971c2">生成 task env 0</text>
    <rect x="16" y="72" width="150" height="34" rx="8" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="91" y="94" font-size="12" text-anchor="middle" fill="#1971c2">生成 task env 1</text>
    <rect x="16" y="114" width="150" height="34" rx="8" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="91" y="136" font-size="12" text-anchor="middle" fill="#1971c2">… env N</text>

    <path d="M170,47 h120" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <path d="M170,89 h120" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <path d="M170,131 h120" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <text x="230" y="26" font-size="11" fill="#868e96" text-anchor="middle">(env_id, action)</text>

    <rect x="294" y="30" width="120" height="120" rx="10" fill="#fff4e6" stroke="#e8590c"></rect>
    <text x="354" y="76" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="700">env_action</text>
    <text x="354" y="94" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="700">_queue</text>
    <text x="354" y="120" font-size="10.5" text-anchor="middle" fill="#868e96">锁步栅栏</text>

    <path d="M418,90 h120" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <text x="478" y="26" font-size="11" fill="#868e96" text-anchor="middle">等齐后批量</text>

    <rect x="542" y="42" width="200" height="96" rx="10" fill="#ebfbee" stroke="#69db7c" stroke-width="1.6"></rect>
    <text x="642" y="72" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="700">env_loop（同步）</text>
    <text x="642" y="94" font-size="11" text-anchor="middle" fill="#495057">env.step(actions)</text>
    <text x="642" y="114" font-size="11" text-anchor="middle" fill="#495057">处理 reset 请求 · 更新 stats</text>

    <path d="M742,90 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <rect x="786" y="42" width="198" height="96" rx="10" fill="#f1f3f5" stroke="#adb5bd"></rect>
    <text x="885" y="72" font-size="12.5" text-anchor="middle" fill="#212529" font-weight="700">停止条件</text>
    <text x="885" y="94" font-size="11" text-anchor="middle" fill="#495057">guarantee_success → 攒成功数</text>
    <text x="885" y="114" font-size="11" text-anchor="middle" fill="#495057">否则 → 跑够尝试数</text>

    <path d="M170,200 h120" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <text x="230" y="192" font-size="11" fill="#868e96" text-anchor="middle">env_id</text>
    <rect x="294" y="178" width="120" height="44" rx="10" fill="#fff4e6" stroke="#e8590c"></rect>
    <text x="354" y="205" font-size="12" text-anchor="middle" fill="#e8590c">env_reset_queue</text>
    <path d="M418,200 h120" stroke="#495057" stroke-width="1.6" marker-end="url(#a8b)"></path>
    <text x="478" y="192" font-size="11" fill="#868e96" text-anchor="middle">env.reset(env_ids)</text>
    <rect x="542" y="178" width="200" height="44" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="642" y="205" font-size="12" text-anchor="middle" fill="#1971c2">复位 + 随机化 + 快照</text>
  </svg>
