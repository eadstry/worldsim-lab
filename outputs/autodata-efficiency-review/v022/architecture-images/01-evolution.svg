<rect width="1200" height="640" rx="22" fill="#f7f9fc"/>
<style>text{font-family:"Noto Sans CJK SC","WenQuanYi Micro Hei","Microsoft YaHei",sans-serif} .t{font-size:29px;font-weight:700;fill:#122c46}.sub{font-size:17px;fill:#52677c}.head{font-size:21px;font-weight:700}.body{font-size:18px;fill:#233d56}</style>
<text x="40" y="53" class="t">三种实现，两条改动轴</text>
<text x="40" y="87" class="sub">先改保存调度，再单独评估规划迁移；任务与仿真仍是共同主干。</text>
<rect x="40.0" y="120" width="350.6666666666667" height="420" rx="16" fill="white" stroke="#dae3ed"/>
<rect x="40.0" y="120" width="350.6666666666667" height="53" rx="14" fill="#eef2f6"/>
<text x="58.0" y="154" class="head" fill="#516579">A / 原始 v1 路线</text>
<rect x="54.0" y="194" width="322.6666666666667" height="93" rx="10" fill="#eef2f6"/>
<text x="67.0" y="222" font-size="19" font-weight="700" fill="#516579">任务与执行</text>
<text x="67.0" y="247" class="body">AutoData → 仿真 → 录制</text>
<rect x="54.0" y="304" width="322.6666666666667" height="93" rx="10" fill="#eef2f6"/>
<text x="67.0" y="332" font-size="19" font-weight="700" fill="#516579">规划后端</text>
<text x="67.0" y="357" class="body">MotionGen / v1</text>
<rect x="54.0" y="414" width="322.6666666666667" height="93" rx="10" fill="#eef2f6"/>
<text x="67.0" y="442" font-size="19" font-weight="700" fill="#516579">保存方式</text>
<text x="67.0" y="467" class="body">同步压缩与 HDF5 写入</text>
<text x="67.0" y="491" class="body">返回后继续生成</text>
<path d="M393.6666666666667,335 H418.6666666666667" stroke="#75879b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424.6666666666667" y="120" width="350.6666666666667" height="420" rx="16" fill="white" stroke="#dae3ed"/>
<rect x="424.6666666666667" y="120" width="350.6666666666667" height="53" rx="14" fill="#e5f5ef"/>
<text x="442.6666666666667" y="154" class="head" fill="#148269">B / 保存优化 v1</text>
<rect x="438.6666666666667" y="194" width="322.6666666666667" height="93" rx="10" fill="#e5f5ef"/>
<text x="451.6666666666667" y="222" font-size="19" font-weight="700" fill="#148269">任务与执行</text>
<text x="451.6666666666667" y="247" class="body">沿用任务与规划契约</text>
<rect x="438.6666666666667" y="304" width="322.6666666666667" height="93" rx="10" fill="#e5f5ef"/>
<text x="451.6666666666667" y="332" font-size="19" font-weight="700" fill="#148269">规划后端</text>
<text x="451.6666666666667" y="357" class="body">仍为 MotionGen / v1</text>
<rect x="438.6666666666667" y="414" width="322.6666666666667" height="93" rx="10" fill="#e5f5ef"/>
<text x="451.6666666666667" y="442" font-size="19" font-weight="700" fill="#148269">新增保存模块</text>
<text x="451.6666666666667" y="467" class="body">Bridge → Pool → writer</text>
<text x="451.6666666666667" y="491" class="body">共享内存 / 回执 / 合并</text>
<path d="M778.3333333333334,335 H803.3333333333334" stroke="#75879b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="809.3333333333334" y="120" width="350.6666666666667" height="420" rx="16" fill="white" stroke="#dae3ed"/>
<rect x="809.3333333333334" y="120" width="350.6666666666667" height="53" rx="14" fill="#f0ebff"/>
<text x="827.3333333333334" y="154" class="head" fill="#7954bc">C / v2 实验适配</text>
<rect x="823.3333333333334" y="194" width="322.6666666666667" height="93" rx="10" fill="#f0ebff"/>
<text x="836.3333333333334" y="222" font-size="19" font-weight="700" fill="#7954bc">任务与执行</text>
<text x="836.3333333333334" y="247" class="body">适配后接回原执行路径</text>
<rect x="823.3333333333334" y="304" width="322.6666666666667" height="93" rx="10" fill="#f0ebff"/>
<text x="836.3333333333334" y="332" font-size="19" font-weight="700" fill="#7954bc">更换规划后端</text>
<text x="836.3333333333334" y="357" class="body">MotionPlanner / v2</text>
<text x="836.3333333333334" y="381" class="body">模型、目标与轨迹转换</text>
<rect x="823.3333333333334" y="414" width="322.6666666666667" height="93" rx="10" fill="#f0ebff"/>
<text x="836.3333333333334" y="442" font-size="19" font-weight="700" fill="#7954bc">保存方式</text>
<text x="836.3333333333334" y="467" class="body">沿用异步保存机制</text>
<text x="836.3333333333334" y="491" class="body">独立冻结实验入口</text>
<text x="42" y="584" class="sub">A → B：保存侧工程优化　　B → C：规划侧迁移　　C 不代表当前生产默认配置</text>
<text x="42" y="613" font-size="13" fill="#7a8da0">AUTODATA · ARCHITECTURE NOTES / v022 · 2026-10-16 · 箭头表示关系，不表示耗时比例</text></svg>