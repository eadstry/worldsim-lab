<svg viewBox="0 0 1000 280" role="img" aria-label="SkillGen 两阶段：transit + skill" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="a9" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#adb5bd"></path>
      </marker>
    </defs>
    <rect x="16" y="90" width="150" height="70" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="91" y="118" font-size="12.5" text-anchor="middle" fill="#1971c2" font-weight="700">机器人当前位姿</text>
    <text x="91" y="140" font-size="11" text-anchor="middle" fill="#868e96">每 tick 真实状态</text>
    <path d="M170,125 h44" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a9)"></path>

    <rect x="220" y="70" width="300" height="110" rx="12" fill="#ebfbee" stroke="#69db7c" stroke-width="1.6"></rect>
    <text x="370" y="98" font-size="13.5" text-anchor="middle" fill="#2f9e44" font-weight="800">① Transit（规划）</text>
    <text x="370" y="122" font-size="11.5" text-anchor="middle" fill="#495057" font-family="ui-monospace,Menlo,monospace">planner.update_world_and_plan_motion(...)</text>
    <text x="370" y="144" font-size="11.5" text-anchor="middle" fill="#495057">cuRobo 无碰撞规划；手中物体附着到运动链一起碰撞检查</text>
    <text x="370" y="164" font-size="11" text-anchor="middle" fill="#e8590c">规划失败 → 本次 attempt 记失败，重试</text>

    <path d="M524,125 h44" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a9)"></path>

    <rect x="572" y="70" width="300" height="110" rx="12" fill="#f8f0fc" stroke="#d0bfff" stroke-width="1.6"></rect>
    <text x="722" y="98" font-size="13.5" text-anchor="middle" fill="#9c36b5" font-weight="800">② Skill（回放）</text>
    <text x="722" y="122" font-size="11.5" text-anchor="middle" fill="#495057">变换后的演示技能段，逐步回放</text>
    <text x="722" y="144" font-size="11.5" text-anchor="middle" fill="#495057">action_noise 提供多样性</text>
    <text x="722" y="164" font-size="11" text-anchor="middle" fill="#868e96">约束只在技能段生效；transit 无约束</text>

    <path d="M876,125 h44" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a9)"></path>
    <rect x="920" y="90" width="64" height="70" rx="10" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="952" y="120" font-size="12" text-anchor="middle" fill="#2f9e44">下一</text>
    <text x="952" y="138" font-size="12" text-anchor="middle" fill="#2f9e44">子任务</text>

    <text x="16" y="40" font-size="12.5" font-weight="700" fill="#212529">两阶段如何衔接（生成器完全不知道 cuRobo 的存在）</text>
    <text x="16" y="222" font-size="12" fill="#495057">1. 算法返回 <tspan font-family="ui-monospace,Menlo,monospace">(transit_waypoints, True)</tspan>，并把真实技能段 stash 到 per-EEF 状态。</text>
    <text x="16" y="244" font-size="12" fill="#495057">2. 生成器执行 transit（跳过约束），完成后再次调用算法。</text>
    <text x="16" y="266" font-size="12" fill="#495057">3. 算法发现已 stash 的技能段，用 <tspan font-family="ui-monospace,Menlo,monospace">force_use_prev_traj=True</tspan> 从 transit 终点接上并返回 <tspan font-family="ui-monospace,Menlo,monospace">(skill, False)</tspan>。</text>
  </svg>
