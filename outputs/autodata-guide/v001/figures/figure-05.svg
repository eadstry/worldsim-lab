<svg viewBox="0 0 1000 250" role="img" aria-label="Waypoint 装配流程" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="a7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#adb5bd"></path>
      </marker>
    </defs>
    <rect x="16" y="60" width="150" height="60" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="91" y="84" font-size="12" text-anchor="middle" fill="#1971c2">变换后的位姿</text>
    <text x="91" y="104" font-size="11" text-anchor="middle" fill="#868e96">[T,4,4]</text>
    <path d="M170,90 h34" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a7)"></path>

    <rect x="210" y="60" width="170" height="60" rx="10" fill="#f8f0fc" stroke="#d0bfff"></rect>
    <text x="295" y="84" font-size="12" text-anchor="middle" fill="#9c36b5">WaypointSequence</text>
    <text x="295" y="104" font-size="11" text-anchor="middle" fill="#868e96">from_poses() 一段</text>
    <path d="M384,90 h34" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a7)"></path>

    <rect x="424" y="60" width="180" height="60" rx="10" fill="#f8f0fc" stroke="#d0bfff"></rect>
    <text x="514" y="84" font-size="12" text-anchor="middle" fill="#9c36b5">WaypointTrajectory</text>
    <text x="514" y="104" font-size="11" text-anchor="middle" fill="#868e96">merge() 加桥接段</text>
    <path d="M608,90 h34" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a7)"></path>

    <rect x="648" y="60" width="130" height="60" rx="10" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="713" y="84" font-size="12" text-anchor="middle" fill="#2f9e44">拍平</text>
    <text x="713" y="104" font-size="11" text-anchor="middle" fill="#868e96">list[Waypoint]</text>
    <path d="M782,90 h34" stroke="#adb5bd" stroke-width="1.8" marker-end="url(#a7)"></path>

    <rect x="820" y="60" width="164" height="60" rx="10" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="902" y="84" font-size="12" text-anchor="middle" fill="#2f9e44">MultiWaypoint</text>
    <text x="902" y="104" font-size="11" text-anchor="middle" fill="#868e96">execute() → action</text>

    <line x1="16" y1="40" x2="608" y2="40" stroke="#1971c2" stroke-dasharray="5 4"></line>
    <text x="16" y="30" font-size="12" fill="#1971c2" font-weight="700">构造期：算出一条正确的行程</text>
    <line x1="648" y1="40" x2="984" y2="40" stroke="#2f9e44" stroke-dasharray="5 4"></line>
    <text x="984" y="30" font-size="12" fill="#2f9e44" font-weight="700" text-anchor="end">执行期：按帧消费</text>

    <text x="91" y="150" font-size="11.5" fill="#868e96" text-anchor="middle">①</text>
    <text x="295" y="150" font-size="11.5" fill="#868e96" text-anchor="middle">②</text>
    <text x="514" y="150" font-size="11.5" fill="#868e96" text-anchor="middle">③</text>
    <text x="713" y="150" font-size="11.5" fill="#868e96" text-anchor="middle">④</text>
    <text x="902" y="150" font-size="11.5" fill="#868e96" text-anchor="middle">⑤</text>

    <text x="500" y="196" font-size="12" fill="#495057" text-anchor="middle">①②③ 在构造期；④⑤ 在执行期。Trajectory 到最后被拍平成普通 list[Waypoint]，执行时不再需要“段”的概念。</text>
    <text x="500" y="222" font-size="11.5" fill="#868e96" text-anchor="middle">数据来源：每 tick 为每条臂取一个 Waypoint（暂停中的臂取 hold 的那个），组成 dict 再包成 MultiWaypoint。</text>
  </svg>
