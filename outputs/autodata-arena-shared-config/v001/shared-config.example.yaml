schema_version: 1
task_id: openarm_left_cube_on_scanned_pad
common:
  core:
    module: openarm_autodata.tasks.pick_place.configs.left_env_cfg
    class: OpenArmLeftPickPlaceEnvCfg
    package_version: REQUIRED_LOCKED_VERSION
  gym_id: Isaac-PickPlace-Cube-OpenArm-Bimanual-Left-IK-Rel-v0
  environment_profile_ref: openarm_autodata/tasks/pick_place/autodata_configs/env_profiles/openarm_left_skillgen.yaml
  contract:
    arm: left
    action: {kind: relative_tcp_ik, dimensions: 7, position_scale_m: 0.02, rotation_scale_rad: 0.10}
