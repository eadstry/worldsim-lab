  planner_profile: openarm_pick_place_left
  seed: 1
  num_trials: 10
  guarantee_success: true
  keep_failed: false
  max_num_failures: 25
  environment_terminations: disabled_success_checked_by_generator
  input_dataset: local://annotated_openarm_left
  output_dataset: local://generated_openarm_left
evaluation:
  seeds: [11, 22, 33]
  episodes_per_seed: 100
  num_envs: 4
  episode_length_s: 90.0
  failures: [cube_dropped, time_out]
