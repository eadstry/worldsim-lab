      release_position: 0.30
      max_linear_speed: 0.03
      max_angular_speed: 0.5
      require_grasp_history: false
generation:
  algorithm: skillgen
  task_descriptor_ref: openarm_autodata/tasks/pick_place/autodata_configs/tasks/openarm_bimanual_left_pick_place.yaml
