name: openarm_bimanual_left_cube_pick_place
description: Pick up a cube with the OpenArm left hand and place it on the pad scanned into the desk mesh.
algo: skillgen

generation_policy:
  name: openarm_bimanual_left_cube_pick_place
  seed: 1
  num_trials: 10
  guarantee_success: true
  keep_failed: false
  max_num_failures: 25
  use_skillgen: true
  select_src_per_subtask: true
  transform_first_robot_pose: false
  interpolate_from_last_target_pose: true

subtasks:
  left:
    - object_ref: cube
      subtask_term_signal: grasp
      subtask_term_offset_range: [0, 0]
      selection_strategy: nearest_neighbor_object
      action_noise: 0.0
      num_interpolation_steps: 0

    # The pad is part of the desk mesh, so placement skills use the table frame.
    - object_ref: table
      subtask_term_signal: place
      algo_params:
        expected_attached_object: cube
      subtask_term_offset_range: [0, 0]
      selection_strategy: nearest_neighbor_object
      action_noise: 0.0
      num_interpolation_steps: 0
