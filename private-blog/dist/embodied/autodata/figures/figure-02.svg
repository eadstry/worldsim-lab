<svg viewBox="0 0 1000 430" role="img" aria-label="AutoData 架构：契约 → Datastream → 生成器/算法 → 仿真 → 数据集" class="svgtxt" xmlns="http://www.w3.org/2000/svg"><style>.path{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#868e96}.svgtxt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}</style>
    <defs>
      <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#495057"></path>
      </marker>
    </defs>

    <!-- 契约层 -->
    <text x="16" y="26" font-size="13" font-weight="700" fill="#1971c2">声明式契约（YAML）· 输入</text>
    <rect x="16" y="38" width="222" height="70" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="30" y="62" font-size="13" font-weight="700" fill="#1971c2">Task Descriptor</text>
    <text x="30" y="82" font-size="11" fill="#495057">子任务 / 边界信号 / 约束 / 生成策略</text>
    <text x="30" y="99" font-size="10.5" class="path" fill="#868e96">franka_cube_stack.yaml</text>

    <rect x="16" y="122" width="222" height="70" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="30" y="146" font-size="13" font-weight="700" fill="#1971c2">Embodiment</text>
    <text x="30" y="166" font-size="11" fill="#495057">位姿观测键 / 位姿 ↔ action 编解码</text>
    <text x="30" y="183" font-size="10.5" class="path" fill="#868e96">franka_ik_rel.yaml</text>

    <rect x="16" y="206" width="222" height="70" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="30" y="230" font-size="13" font-weight="700" fill="#1971c2">Source Dataset</text>
    <text x="30" y="250" font-size="11" fill="#495057">已标注人工演示（HDF5）</text>
    <text x="30" y="267" font-size="10.5" class="path" fill="#868e96">dataset_*_annotated.hdf5</text>

    <rect x="16" y="290" width="222" height="70" rx="10" fill="#e7f5ff" stroke="#74c0fc"></rect>
    <text x="30" y="314" font-size="13" font-weight="700" fill="#1971c2">Env Profile（可选）</text>
    <text x="30" y="334" font-size="11" fill="#495057">场景增删改 / reset 事件 / planner</text>
    <text x="30" y="351" font-size="10.5" class="path" fill="#868e96">franka_bin_stack.yaml</text>

    <!-- Datastream -->
    <path d="M244,68 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a2)"></path>
    <path d="M244,157 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a2)"></path>
    <path d="M244,240 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a2)"></path>
    <rect x="290" y="48" width="180" height="230" rx="12" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6"></rect>
    <text x="380" y="80" font-size="14" font-weight="800" fill="#212529" text-anchor="middle">Datastream</text>
    <text x="380" y="102" font-size="11" fill="#495057" text-anchor="middle">唯一只读接口</text>
    <line x1="308" y1="116" x2="452" y2="116" stroke="#dee2e6"></line>
    <text x="380" y="138" font-size="11" fill="#495057" text-anchor="middle">物体/EEF 位姿 · 关节</text>
    <text x="380" y="158" font-size="11" fill="#495057" text-anchor="middle">子任务信号 · 场景快照</text>
    <text x="380" y="178" font-size="11" fill="#495057" text-anchor="middle">位姿 ↔ action 编解码</text>
    <text x="380" y="198" font-size="11" fill="#495057" text-anchor="middle">USD stage（碰撞世界）</text>
    <text x="380" y="218" font-size="11" fill="#495057" text-anchor="middle">源演示池 + 边界表</text>
    <text x="380" y="252" font-size="10.5" fill="#e8590c" text-anchor="middle">写操作走 get_env() 逃生口</text>
    <text x="380" y="268" font-size="10.5" fill="#868e96" text-anchor="middle">（step / reset / recorder）</text>

    <!-- 生成器 + 算法 -->
    <path d="M474,163 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a2)"></path>
    <rect x="520" y="48" width="200" height="110" rx="12" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="620" y="76" font-size="14" font-weight="800" fill="#2f9e44" text-anchor="middle">DataGenerator</text>
    <text x="620" y="98" font-size="11" fill="#495057" text-anchor="middle">每个 attempt 的主循环</text>
    <text x="620" y="118" font-size="11" fill="#495057" text-anchor="middle">Reset→抖动→选段→变换</text>
    <text x="620" y="138" font-size="11" fill="#495057" text-anchor="middle">→桥接→执行→录制</text>

    <rect x="520" y="168" width="200" height="110" rx="12" fill="#f8f0fc" stroke="#d0bfff"></rect>
    <text x="620" y="196" font-size="14" font-weight="800" fill="#9c36b5" text-anchor="middle">GenerationAlgorithm</text>
    <text x="620" y="218" font-size="11" fill="#495057" text-anchor="middle">插件式钩子</text>
    <text x="620" y="238" font-size="11" fill="#495057" text-anchor="middle">mimicgen / dexmimicgen</text>
    <text x="620" y="258" font-size="11" fill="#495057" text-anchor="middle">/ skillgen</text>
    <text x="620" y="276" font-size="10.5" fill="#868e96" text-anchor="middle">plan_subtask_trajectory()</text>

    <!-- 仿真循环 -->
    <path d="M724,80 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a2)"></path>
    <path d="M724,220 h40" stroke="#495057" stroke-width="1.6" marker-end="url(#a2)"></path>
    <rect x="770" y="60" width="214" height="200" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"></rect>
    <text x="877" y="88" font-size="14" font-weight="800" fill="#e8590c" text-anchor="middle">env_loop（同步锁步）</text>
    <text x="877" y="110" font-size="11" fill="#495057" text-anchor="middle">等齐每个 env 各一个 action</text>
    <text x="877" y="130" font-size="11" fill="#495057" text-anchor="middle">→ 批量 env.step()</text>
    <text x="877" y="150" font-size="11" fill="#495057" text-anchor="middle">→ 处理 reset 请求</text>
    <line x1="788" y1="166" x2="966" y2="166" stroke="#ffd8a8"></line>
    <text x="877" y="188" font-size="11" fill="#495057" text-anchor="middle">Isaac Sim / Isaac Lab 仿真</text>
    <text x="877" y="208" font-size="11" fill="#495057" text-anchor="middle">recorder_manager 记录 episode</text>
    <text x="877" y="234" font-size="11" fill="#495057" text-anchor="middle">每步判 success（成功即锁存）</text>
    <text x="877" y="252" font-size="10.5" fill="#868e96" text-anchor="middle">成功 episode 导出到 HDF5</text>

    <text x="520" y="312" font-size="12" fill="#495057">输出：</text>
    <rect x="520" y="322" width="200" height="58" rx="10" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="620" y="346" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="middle">生成数据集 HDF5</text>
    <text x="620" y="366" font-size="11" fill="#495057" text-anchor="middle">生成的成功 episode</text>
    <rect x="740" y="322" width="244" height="58" rx="10" fill="#ebfbee" stroke="#69db7c"></rect>
    <text x="862" y="346" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="middle">--result_file JSON</text>
    <text x="862" y="366" font-size="11" fill="#495057" text-anchor="middle">计数 / 算法 / profile 元信息</text>

    <text x="16" y="404" font-size="11.5" fill="#868e96">关键边界：算法与生成器之间只用 Waypoint 对话（见 ⑦）；只有 MultiWaypoint.execute 才把位姿编码成 action。</text>
  </svg>
